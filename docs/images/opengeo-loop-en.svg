<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img"><title>Five responsibilities in one improvement loop</title><rect width="1280" height="210" rx="12" fill="#f7f9f7"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><circle cx="63" cy="49" r="15" fill="#1c2821"/><text x="63" y="54" text-anchor="middle" font-size="12" fill="white">1</text><text x="48" y="99" font-size="22" font-weight="650" fill="#25372b">Understand</text><text x="48" y="130" font-size="14" fill="#68776b">Product + contributions</text><path d="M96 49h162m-6-4 6 4-6 4" fill="none" stroke="#ccd7cd"/><circle cx="311" cy="49" r="15" fill="#1c2821"/><text x="311" y="54" text-anchor="middle" font-size="12" fill="white">2</text><text x="296" y="99" font-size="22" font-weight="650" fill="#25372b">Choose</text><text x="296" y="130" font-size="14" fill="#68776b">Questions worth asking</text><path d="M344 49h162m-6-4 6 4-6 4" fill="none" stroke="#ccd7cd"/><circle cx="559" cy="49" r="15" fill="#1c2821"/><text x="559" y="54" text-anchor="middle" font-size="12" fill="white">3</text><text x="544" y="99" font-size="22" font-weight="650" fill="#25372b">Diagnose</text><text x="544" y="130" font-size="14" fill="#68776b">Answers + evidence</text><path d="M592 49h162m-6-4 6 4-6 4" fill="none" stroke="#ccd7cd"/><circle cx="807" cy="49" r="15" fill="#1c2821"/><text x="807" y="54" text-anchor="middle" font-size="12" fill="white">4</text><text x="792" y="99" font-size="22" font-weight="650" fill="#25372b">Review</text><text x="792" y="130" font-size="14" fill="#68776b">A deliverable change</text><path d="M840 49h162m-6-4 6 4-6 4" fill="none" stroke="#ccd7cd"/><circle cx="1055" cy="49" r="15" fill="#1c2821"/><text x="1055" y="54" text-anchor="middle" font-size="12" fill="white">5</text><text x="1040" y="99" font-size="22" font-weight="650" fill="#25372b">Observe</text><text x="1040" y="130" font-size="14" fill="#68776b">Results test the judgment</text><path d="M1055 161v15H63v-15" fill="none" stroke="#bacbbb" stroke-dasharray="4 4"/><text x="640" y="199" text-anchor="middle" font-size="11" fill="#78907c">Use real feedback to test scores and strategies · Effectiveness still needs validation</text></g></svg>