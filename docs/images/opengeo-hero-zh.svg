<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
<title id="title">OpenGEO — 把「AI 搜不到我」， 变成下一步行动。</title><desc id="desc">选对问题，追到证据，审核方案。 用后续的真实变化，检验这次改进。</desc>
<defs><filter id="shadow" x="-30%" y="-40%" width="170%" height="190%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#273d36" flood-opacity=".09"/></filter><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf8"/><stop offset="1" stop-color="#edf3f0"/></linearGradient></defs>
<rect width="1280" height="510" rx="18" fill="#fafbfa"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="44" y="40" width="29" height="29" rx="8" fill="#1b2521"/><text x="58.5" y="62" text-anchor="middle" font-size="23" font-weight="700" fill="white">O</text><text x="84" y="62" font-size="23" font-weight="700" fill="#19231f">OpenGEO</text>
<text x="44" y="112" font-size="12" letter-spacing="2.2" fill="#65756d">OPEN SOURCE · LOCAL FIRST</text>
<text x="42" y="181" font-size="46" font-weight="750" letter-spacing="-1.8" fill="#17221c">把「AI 搜不到我」，</text>
<text x="42" y="244" font-size="46" font-weight="750" letter-spacing="-1.8" fill="#17221c">变成下一步行动。</text>
<text x="44" y="299" font-size="18" fill="#66716b">选对问题，追到证据，审核方案。</text><text x="44" y="328" font-size="18" fill="#66716b">用后续的真实变化，检验这次改进。</text>
<rect x="44" y="377" width="188" height="36" rx="18" fill="#e8eee9"/><circle cx="62" cy="395" r="4" fill="#4c7964"/><text x="77" y="400" font-size="13" fill="#395544">为独立开发者与小团队</text>
<rect x="676" y="40" width="561" height="424" rx="24" fill="url(#wash)"/>
<g transform="rotate(-3 937 234)" filter="url(#shadow)"><rect x="714" y="83" width="474" height="280" rx="15" fill="white" stroke="#e1e7e3"/>
<circle cx="736" cy="105" r="3" fill="#cdd5cf"/><circle cx="748" cy="105" r="3" fill="#cdd5cf"/><circle cx="760" cy="105" r="3" fill="#cdd5cf"/>
<text x="780" y="110" font-size="12" fill="#77847b">OpenGEO / 调查工作台</text><path d="M714 123H1188" stroke="#edf0ed"/>
<text x="740" y="157" font-size="12" letter-spacing="1" fill="#7d8981">从问题出发</text><rect x="738" y="178" width="424" height="42" rx="7" fill="#fafbf9"/><text x="753" y="205" font-size="12" fill="#89958c">01</text><text x="781" y="205" font-size="14" fill="#39473e">理解产品与已有贡献</text><rect x="738" y="230" width="424" height="42" rx="7" fill="#f1f6f2"/><text x="753" y="257" font-size="12" fill="#89958c">02</text><text x="781" y="257" font-size="14" fill="#39473e">确认值得搜索的问题</text><rect x="738" y="282" width="424" height="42" rx="7" fill="#fafbf9"/><text x="753" y="309" font-size="12" fill="#89958c">03</text><text x="781" y="309" font-size="14" fill="#39473e">搜索结果与原始来源</text></g><g filter="url(#shadow)"><rect x="768" y="307" width="437" height="136" rx="18" fill="white" stroke="#dce6de"/>
<rect x="788" y="327" width="29" height="29" rx="9" fill="#202d25"/><path d="M796 339l5 5 9-10" fill="none" stroke="#e8f5e7" stroke-width="2"/>
<text x="830" y="346" font-size="18" font-weight="650" fill="#25372b">每个改进，都要经得起审核。</text>
<text x="789" y="377" font-size="13" fill="#758177">独立上下文审核 · 修改后完整复审</text><rect x="789" y="394" width="110" height="27" rx="6" fill="#f2f5f1"/><text x="844" y="412" text-anchor="middle" font-size="12" fill="#526451">有依据</text><rect x="911" y="394" width="110" height="27" rx="6" fill="#f2f5f1"/><text x="966" y="412" text-anchor="middle" font-size="12" fill="#526451">能执行</text><rect x="1033" y="394" width="110" height="27" rx="6" fill="#f2f5f1"/><text x="1088" y="412" text-anchor="middle" font-size="12" fill="#526451">能跟测</text></g><text x="1209" y="488" text-anchor="end" font-size="11" fill="#8b958d">1.0 产品工作流示意</text></g></svg>