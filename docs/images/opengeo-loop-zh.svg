<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img"><title>五环 Agent 主线</title><rect width="1280" height="210" rx="12" fill="#f7f9f7"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><circle cx="63" cy="49" r="15" fill="#1c2821"/><text x="63" y="54" text-anchor="middle" font-size="12" fill="white">1</text><text x="48" y="99" font-size="22" font-weight="650" fill="#25372b">理解</text><text x="48" y="130" font-size="14" fill="#68776b">产品与已有贡献</text><path d="M96 49h162m-6-4 6 4-6 4" fill="none" stroke="#ccd7cd"/><circle cx="311" cy="49" r="15" fill="#1c2821"/><text x="311" y="54" text-anchor="middle" font-size="12" fill="white">2</text><text x="296" y="99" font-size="22" font-weight="650" fill="#25372b">选题</text><text x="296" y="130" font-size="14" fill="#68776b">值得争取的问题</text><path d="M344 49h162m-6-4 6 4-6 4" fill="none" stroke="#ccd7cd"/><circle cx="559" cy="49" r="15" fill="#1c2821"/><text x="559" y="54" text-anchor="middle" font-size="12" fill="white">3</text><text x="544" y="99" font-size="22" font-weight="650" fill="#25372b">诊断</text><text x="544" y="130" font-size="14" fill="#68776b">回答、来源与缺口</text><path d="M592 49h162m-6-4 6 4-6 4" fill="none" stroke="#ccd7cd"/><circle cx="807" cy="49" r="15" fill="#1c2821"/><text x="807" y="54" text-anchor="middle" font-size="12" fill="white">4</text><text x="792" y="99" font-size="22" font-weight="650" fill="#25372b">审核</text><text x="792" y="130" font-size="14" fill="#68776b">方案是否能交付</text><path d="M840 49h162m-6-4 6 4-6 4" fill="none" stroke="#ccd7cd"/><circle cx="1055" cy="49" r="15" fill="#1c2821"/><text x="1055" y="54" text-anchor="middle" font-size="12" fill="white">5</text><text x="1040" y="99" font-size="22" font-weight="650" fill="#25372b">观察</text><text x="1040" y="130" font-size="14" fill="#68776b">真实变化检验判断</text><path d="M1055 161v15H63v-15" fill="none" stroke="#bacbbb" stroke-dasharray="4 4"/><text x="640" y="199" text